---
# Polaris installer account policy.
# Calamares creates a normal desktop user, then offers an enabled root
# account with either the same password or a separately chosen password.

defaultGroups:
  - name: users
    must_exist: true
    system: true
  - audio
  - cdrom
  - dialout
  - floppy
  - video
  - plugdev
  - netdev
  - scanner
  - bluetooth
  - sudo

sudoersGroup: sudo
sudoersConfigureWithGroup: true

# Keep the root account enabled and let the installer collect its password.
setRootPassword: true
doReusePassword: false

# Do not automatically log in after installation.
displayAutologin: true
doAutologin: false

passwordRequirements:
  minLength: 1
  maxLength: -1

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  forbidden_names: [ root ]
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "polaris-${login}"
  forbidden_names: [ localhost ]

allowActiveDirectory: false
